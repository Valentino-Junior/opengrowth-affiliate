# nginx site for the affiliate app, on a VPS whose nginx already serves other sites.
#   sudo cp deploy/nginx-affiliate.conf /etc/nginx/sites-available/affiliate.opengrowthofficial.com
#   sudo ln -s /etc/nginx/sites-available/affiliate.opengrowthofficial.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d affiliate.opengrowthofficial.com     # adds HTTPS to this file and renews it
# The app container listens on 127.0.0.1:3100 (APP_HOST_PORT in .env).

server {
    listen 80;
    listen [::]:80;
    server_name affiliate.opengrowthofficial.com;

    # Payment screenshots and ID photos: up to 10 MB each, two per form.
    client_max_body_size 21m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace (don't append) the client address, so nobody can fake it to dodge the login limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
